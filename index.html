<!DOCTYPE html>
<html>
  <head>
    <title>Tower Defense</title>
    <script src="pathData.js" defer></script>
    <script src="waveData.js" defer></script>
    <script src="data.js" defer></script>
    <script src="functions.js" defer></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <canvas id="myCanvas" width="700" height="600"></canvas>

      <div id="ui">
        <div class="hud-panel">
          <span>Lives: <strong id="lives">0</strong></span>
          <span>Money: <strong id="money">0</strong></span>
          <span>Score: <strong id="score">0</strong></span>
          <span>Assault: <strong id="assault">0</strong>/<strong id="maxAssault">0</strong></span>
          <span>Enemies: <strong id="enemyCount">0</strong></span>
        </div>

        <div id="buy" aria-label="Tower shop">
          <button class="tower-button" data-tower-type-index="0" id="infantry" type="button">
            <img src="sprites/brodie.png" alt="Infantry tower">
          </button>
          <button class="tower-button" data-tower-type-index="1" id="machineGun" type="button">
            <img src="sprites/vickers.png" alt="Machine gun tower">
          </button>
        </div>

        <button class="mute-button" id="muteBtn" type="button">Sound</button>
      </div>
    </div>
  </body>
</html>
